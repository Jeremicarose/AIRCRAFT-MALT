name: ckb-registry-v2-reference

x-mlat-service: &mlat-service
  build:
    context: .
  env_file:
    - .env
  environment:
    HEALTH_STALE_SIGNAL_SECONDS: 120
    STATS_INTERVAL_SECONDS: 60
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs

services:
  mlat-processor:
    <<: *mlat-service
    command: mlat-processor

  mlat-api:
    <<: *mlat-service
    command: mlat-api
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mlat-frontend:
    build:
      context: ./reference/mlat/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    depends_on:
      mlat-api:
        condition: service_healthy
    environment:
      MLAT_API_INTERNAL_URL: http://mlat-api:5000
    init: true
    ports:
      - "3000:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
