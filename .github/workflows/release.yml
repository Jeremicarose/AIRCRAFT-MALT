name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      AR_riscv64imac_unknown_none_elf: riscv64-unknown-elf-ar
      CC_riscv64imac_unknown_none_elf: riscv64-unknown-elf-gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Enforce release prerequisites
        run: |
          test -f LICENSE
          test -f RELEASE.md
          test -f SECURITY.md
          test -f docs/audit/REPOSITORY_AUDIT.md
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: reference/mlat/frontend/package-lock.json
      - name: Install locked Python graph
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Verify Python and evidence
        run: |
          python -m pytest -q
          python tools/mlat/run_reproducible_benchmark.py --verify-only
          python tools/registry/verify_registry_v2_evidence.py --bundle evidence/registry-v2-testnet-2026-07-30-final
      - name: Build frontend
        working-directory: reference/mlat/frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install contract compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-riscv64-unknown-elf
      - name: Build and test Registry V2 contract
        working-directory: contracts/registry-v2
        run: |
          rustup show
          rustup component add rustfmt
          cargo fmt -- --check
          make test
          make check
      - name: Assemble release artifacts
        run: |
          mkdir -p artifacts
          cp contracts/registry-v2/target/riscv64imac-unknown-none-elf/release/receiver-registry artifacts/receiver-registry-v2
          git archive --format=tar.gz --prefix="ckb-registry-v2-${GITHUB_REF_NAME}/" --output="artifacts/ckb-registry-v2-${GITHUB_REF_NAME}.tar.gz" HEAD
          tar -czf artifacts/mlat-reproducible-benchmark-v2.tar.gz evidence/mlat-reference/reproducible-benchmark-v2
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/ckb-registry-v2.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum receiver-registry-v2 ckb-registry-v2-*.tar.gz mlat-reproducible-benchmark-v2.tar.gz ckb-registry-v2.spdx.json > checksums.sha256
      - name: Attest contract provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/receiver-registry-v2
      - name: Attest source SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/ckb-registry-v2-*.tar.gz
          sbom-path: artifacts/ckb-registry-v2.spdx.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
