name: Pilot Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      registry_code_hash:
        description: "Verified immutable data1 code hash (optional until deployment exists)"
        required: false
        type: string
      registry_contract_tx_hash:
        description: "Verified deployment transaction hash (optional until deployment exists)"
        required: false
        type: string
      registry_contract_index:
        description: "Verified deployment output index"
        required: false
        default: "0"
        type: string
      receiver_identity:
        description: "Known live receiver Type ID to compare against the public indexer"
        required: false
        type: string
      receiver_tx_hash:
        description: "Known live receiver cell transaction hash"
        required: false
        type: string
      receiver_output_index:
        description: "Known live receiver cell output index"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PILOT_ARTIFACT_DIR: artifacts/pilot-readiness-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            reference/mlat/frontend/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Install locked SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Install locked frontend dependencies
        working-directory: reference/mlat/frontend
        run: npm ci
      - name: Install contract compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-riscv64-unknown-elf
      - name: Run the clean-clone Registry and MLAT evidence bundle
        run: |
          mkdir -p "$PILOT_ARTIFACT_DIR"
          python tools/registry/generate_registry_v2_review_evidence.py \
            --output "$PILOT_ARTIFACT_DIR/review"
      - name: Run strict live preflight and preserve its blockers
        continue-on-error: true
        run: |
          python tools/mlat/check_live_ingest_readiness.py \
            --output "$PILOT_ARTIFACT_DIR/strict-live-preflight.json" \
            --require-ready
      - name: Verify immutable deployment when supplied
        if: ${{ inputs.registry_code_hash != '' && inputs.registry_contract_tx_hash != '' }}
        run: |
          python tools/registry/verify_data1_deployment.py \
            --contract-tx-hash "${{ inputs.registry_contract_tx_hash }}" \
            --contract-index "${{ inputs.registry_contract_index }}" \
            --code-hash "${{ inputs.registry_code_hash }}" \
            --output "$PILOT_ARTIFACT_DIR/data1-deployment.json"
      - name: Compare the public indexer with direct RPC when supplied
        if: ${{ inputs.registry_code_hash != '' && inputs.receiver_identity != '' && inputs.receiver_tx_hash != '' }}
        continue-on-error: true
        run: |
          python tools/registry/check_registry_indexer_health.py \
            --contract-code-hash "${{ inputs.registry_code_hash }}" \
            --hash-type data1 \
            --receiver-identity "${{ inputs.receiver_identity }}" \
            --expected-tx-hash "${{ inputs.receiver_tx_hash }}" \
            --expected-index "${{ inputs.receiver_output_index }}" \
            --output "$PILOT_ARTIFACT_DIR/indexer-health.json"
      - name: Publish pilot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-readiness-${{ github.sha }}
          path: artifacts/pilot-readiness-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
