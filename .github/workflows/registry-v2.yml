name: Registry V2 Security

on:
  pull_request:
    paths:
      - ".github/workflows/registry-v2.yml"
      - "contracts/receiver-registry/**"
      - "src/network/ckb_client.py"
      - "src/network/ckb_discovery.py"
      - "src/network/receiver_registry.py"
      - "scripts/*receiver*"
      - "scripts/registry_v2_testnet_lifecycle.py"
      - "scripts/verify_registry_v2_evidence.py"
      - "tests/test_*receiver*"
      - "tests/test_apply_receiver_type_script.py"
      - "tests/test_ckb_registry.py"
      - "tests/test_contract_layout.py"
  push:
    branches: [main, registry-v2-testnet-evidence]
    paths:
      - ".github/workflows/registry-v2.yml"
      - "contracts/receiver-registry/**"
      - "src/network/ckb_client.py"
      - "src/network/ckb_discovery.py"
      - "src/network/receiver_registry.py"
      - "scripts/*receiver*"
      - "scripts/registry_v2_testnet_lifecycle.py"
      - "scripts/verify_registry_v2_evidence.py"
      - "tests/test_*receiver*"
      - "tests/test_apply_receiver_type_script.py"
      - "tests/test_ckb_registry.py"
      - "tests/test_contract_layout.py"

permissions:
  contents: read

jobs:
  off-chain-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test registry discovery and transaction tooling
        run: >-
          python -m pytest -q
          tests/test_ckb_registry.py
          tests/test_ckb_client.py
          tests/test_contract_layout.py
          tests/test_receiver_record_generator.py
          tests/test_receiver_registration_template.py
          tests/test_receiver_registration_commands.py
          tests/test_apply_receiver_type_script.py
          tests/test_deploy_helpers.py
          tests/test_registry_v2_lifecycle_tool.py
          tests/test_registry_v2_evidence_verifier.py

  on-chain-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/receiver-registry
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust target
        run: rustup show
      - name: Install Rust formatting component
        run: rustup component add rustfmt
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Build and execute CKB-VM security tests
        run: make test
      - name: Check deployable CKB target
        run: make check
      - name: Hash deployable contract
        run: >-
          sha256sum target/riscv64imac-unknown-none-elf/release/receiver-registry
          > receiver-registry.sha256
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: receiver-registry-v2-${{ github.sha }}
          path: |
            contracts/receiver-registry/target/riscv64imac-unknown-none-elf/release/receiver-registry
            contracts/receiver-registry/receiver-registry.sha256
          if-no-files-found: error
          retention-days: 30
