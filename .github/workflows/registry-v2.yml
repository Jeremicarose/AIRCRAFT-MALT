name: Registry V2 Security

on:
  pull_request:
    paths:
      - ".github/workflows/registry-v2.yml"
      - "contracts/registry-v2/**"
      - "src/mlat_reference/ingest/client.py"
      - "src/ckb_registry/**"
      - "tools/registry/**"
      - "tests/registry/**"
      - "sdk/typescript/**"
  push:
    paths:
      - ".github/workflows/registry-v2.yml"
      - "contracts/registry-v2/**"
      - "src/mlat_reference/ingest/client.py"
      - "src/ckb_registry/**"
      - "tools/registry/**"
      - "tests/registry/**"
      - "sdk/typescript/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  off-chain-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install project and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-dev.lock
      - name: Test registry discovery and transaction tooling
        run: python -m pytest -q tests/registry

  on-chain-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_riscv64imac_unknown_none_elf: riscv64-unknown-elf-gcc
      AR_riscv64imac_unknown_none_elf: riscv64-unknown-elf-ar
    defaults:
      run:
        working-directory: contracts/registry-v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust target
        run: rustup show
      - name: Install Rust formatting component
        run: rustup component add rustfmt
      - name: Install bare-metal RISC-V compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-riscv64-unknown-elf
      - name: Print build toolchain provenance
        run: |
          rustc -vV
          cargo -V
          riscv64-unknown-elf-gcc --version
          dpkg-query -W gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Build and execute CKB-VM security tests
        run: make test
      - name: Check deployable CKB target
        run: make check

  deployed-binary-provenance:
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      EXPECTED_RECEIVER_REGISTRY_SHA256: 087a8b19ca99170d8d1e8c018b749259ce067ad3cb1cc8cef3b4a490ccae0465
    defaults:
      run:
        working-directory: contracts/registry-v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust target
        run: rustup show
      - name: Install exact deployment RISC-V toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew version-install riscv64-elf-binutils@2.46.0
          brew version-install riscv64-elf-gcc@16.1.0
      - name: Rebuild the deployed contract from clean source
        run: |
          GCC_PREFIX="$(brew --prefix riscv64-elf-gcc@16.1.0)"
          BINUTILS_PREFIX="$(brew --prefix riscv64-elf-binutils@2.46.0)"
          export CC_riscv64imac_unknown_none_elf="${GCC_PREFIX}/bin/riscv64-elf-gcc"
          export AR_riscv64imac_unknown_none_elf="${BINUTILS_PREFIX}/bin/riscv64-elf-ar"
          test "$("${CC_riscv64imac_unknown_none_elf}" -dumpfullversion)" = "16.1.0"
          "${BINUTILS_PREFIX}/bin/riscv64-elf-ld" --version
          rustc -vV
          cargo -V
          make clean
          make build
      - name: Require exact deployed contract bytes
        run: |
          BINARY="target/riscv64imac-unknown-none-elf/release/receiver-registry"
          ACTUAL_SHA256="$(shasum -a 256 "${BINARY}" | awk '{print $1}')"
          test "${ACTUAL_SHA256}" = "${EXPECTED_RECEIVER_REGISTRY_SHA256}"
          printf '%s  %s\n' "${ACTUAL_SHA256}" "${BINARY}" > receiver-registry.sha256
      - name: Attest exact deployed-binary rebuild
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: contracts/registry-v2/target/riscv64imac-unknown-none-elf/release/receiver-registry
      - name: Upload exact deployed-binary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: receiver-registry-v2-deployed-${{ github.sha }}
          path: |
            contracts/registry-v2/target/riscv64imac-unknown-none-elf/release/receiver-registry
            contracts/registry-v2/receiver-registry.sha256
          if-no-files-found: error
          retention-days: 30

  typescript-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install locked SDK dependencies
        run: npm ci
      - name: Test Registry V2 SDK and shared conformance corpus
        run: npm test

  cross-language-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install locked SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Prove Rust, Python, and TypeScript agreement
        run: >-
          python tools/registry/generate_registry_v2_conformance_report.py
          --output registry-v2-conformance-report.json
      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-v2-conformance-${{ github.sha }}
          path: registry-v2-conformance-report.json
          if-no-files-found: error
          retention-days: 30
