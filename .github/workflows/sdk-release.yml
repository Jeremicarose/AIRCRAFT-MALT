name: Publish Registry V2 SDK

on:
  push:
    tags:
      - "registry-v2-sdk-v*"

concurrency:
  group: registry-v2-sdk-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.2
      - name: Verify tag matches package version
        run: test "registry-v2-sdk-v$(node --print \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - name: Install locked dependencies
        run: npm ci
      - name: Test package
        run: npm test
      - name: Publish public package with provenance
        run: npm publish
        env:
          # Needed only to bootstrap the first release. Remove the repository
          # secret after npm trusted publishing is configured for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
