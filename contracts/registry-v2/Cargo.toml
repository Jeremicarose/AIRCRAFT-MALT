[package]
name = "receiver-registry"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "receiver-registry"
path = "src/main.rs"
test = false
bench = false
required-features = ["contract-bin"]

[dependencies]
ckb-std = { version = "0.16", features = ["type-id"] }
heapless = { version = "0.7.17", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.5"

[features]
default = []
contract-bin = []
native-simulator = []

[profile.release]
overflow-checks = true
panic = "abort"
opt-level = "s"
codegen-units = 1
strip = true

[dev-dependencies]
ckb-system-scripts = "0.5.4"
ckb-testtool = "1.1.1"
hex = "0.4.3"
serde_json = "1"
