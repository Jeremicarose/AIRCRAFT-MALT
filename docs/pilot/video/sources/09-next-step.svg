<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Next step for the Registry V2 pilot</title>
  <desc id="desc">The next step is a six-person testnet pilot moving from expression of interest through eligibility, observed session, and seven-day follow-up.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#5b9cff"/>
    </marker>
    <style>
      .eyebrow { font: 600 15px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #68d5e8; }
      .title { font: 650 46px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #f1f4f8; }
      .subtitle { font: 400 20px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #aab2bd; }
      .step { font: 650 21px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #f1f4f8; }
      .body { font: 400 15px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #aab2bd; }
      .number { font: 650 18px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #080a0d; text-anchor: middle; dominant-baseline: central; }
      .cta { font: 650 25px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #f1f4f8; }
      .small { font: 500 13px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #8f99a6; }
      .mono { font: 500 16px "IBM Plex Mono", Consolas, monospace; fill: #68d5e8; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#080a0d"/>
  <text x="64" y="70" class="eyebrow">THE NEXT STEP</text>
  <text x="64" y="132" class="title">Run a six-person testnet pilot.</text>
  <text x="64" y="174" class="subtitle">The goal is evidence about real usefulness, usability, and integration interest.</text>

  <path d="M340 382H438" stroke="#5b9cff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M718 382H816" stroke="#5b9cff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1096 382H1194" stroke="#5b9cff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(64 260)">
    <rect width="276" height="246" rx="8" fill="#0d1014" stroke="#2a3039"/>
    <circle cx="38" cy="40" r="18" fill="#68d5e8"/>
    <text x="38" y="40" class="number">1</text>
    <text x="24" y="94" class="step">Express interest</text>
    <text x="24" y="130" class="body">Complete the short application.</text>
    <text x="24" y="154" class="body">This is not a confirmed place.</text>
    <line x1="24" y1="190" x2="252" y2="190" stroke="#2a3039"/>
    <text x="24" y="220" class="small">5–8 MINUTES</text>
  </g>

  <g transform="translate(442 260)">
    <rect width="276" height="246" rx="8" fill="#0d1014" stroke="#2a3039"/>
    <circle cx="38" cy="40" r="18" fill="#68d5e8"/>
    <text x="38" y="40" class="number">2</text>
    <text x="24" y="94" class="step">Confirm eligibility</text>
    <text x="24" y="130" class="body">Verify practical receiver or</text>
    <text x="24" y="154" class="body">network experience.</text>
    <line x1="24" y1="190" x2="252" y2="190" stroke="#2a3039"/>
    <text x="24" y="220" class="small">ROLE + COHORT FIT</text>
  </g>

  <g transform="translate(820 260)">
    <rect width="276" height="246" rx="8" fill="#0d1014" stroke="#2a3039"/>
    <circle cx="38" cy="40" r="18" fill="#5b9cff"/>
    <text x="38" y="40" class="number">3</text>
    <text x="24" y="94" class="step">Test and interview</text>
    <text x="24" y="130" class="body">Complete the observed browser</text>
    <text x="24" y="154" class="body">tasks and give candid feedback.</text>
    <line x1="24" y1="190" x2="252" y2="190" stroke="#2a3039"/>
    <text x="24" y="220" class="small">UP TO 65 MINUTES LIVE</text>
  </g>

  <g transform="translate(1198 260)">
    <rect width="338" height="246" rx="8" fill="#0d1014" stroke="#2a3039"/>
    <circle cx="38" cy="40" r="18" fill="#5b9cff"/>
    <text x="38" y="40" class="number">4</text>
    <text x="24" y="94" class="step">Complete the follow-up</text>
    <text x="24" y="130" class="body">Return to the record or assess</text>
    <text x="24" y="154" class="body">one practical integration step.</text>
    <line x1="24" y1="190" x2="314" y2="190" stroke="#2a3039"/>
    <text x="24" y="220" class="small">WITHIN SEVEN DAYS</text>
  </g>

  <rect x="64" y="566" width="1472" height="92" rx="8" fill="#14181e" stroke="#2a3039"/>
  <circle cx="100" cy="612" r="9" fill="#e6c45d"/>
  <text x="126" y="605" class="step">Safety boundary</text>
  <text x="126" y="632" class="body">No private keys, seed phrases, receiver credentials, private feeds, IP addresses, or exact locations.</text>

  <rect x="64" y="700" width="1472" height="132" rx="8" fill="#0d1014" stroke="#68d5e8"/>
  <text x="96" y="746" class="cta">Help test whether shared receiver identity is worth using.</text>
  <text x="96" y="782" class="body">Application link and contact: include them in the video description before publishing.</text>
  <text x="96" y="812" class="mono">github.com/Jeremicarose/AIRCRAFT-MALT</text>
  <text x="1504" y="782" class="small" text-anchor="end">Proposed $30 incentive</text>
  <text x="1504" y="808" class="small" text-anchor="end">conditional on grant approval</text>
</svg>
