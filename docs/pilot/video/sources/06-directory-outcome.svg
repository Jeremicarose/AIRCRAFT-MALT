<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Receiver directory and lifecycle history</title>
  <desc id="desc">An illustrative directory lists current receiver records by stable identity while a timeline shows the selected record's create, update, transfer, and current active state.</desc>
  <defs>
    <style>
      .eyebrow { font: 600 15px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #68d5e8; }
      .title { font: 650 42px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #f1f4f8; }
      .subtitle { font: 400 20px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #aab2bd; }
      .panel-title { font: 650 22px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #f1f4f8; }
      .header { font: 600 13px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #8f99a6; }
      .body { font: 400 15px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #aab2bd; }
      .body-strong { font: 600 16px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #f1f4f8; }
      .mono { font: 500 14px "IBM Plex Mono", Consolas, monospace; fill: #aab2bd; }
      .small { font: 500 13px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #8f99a6; }
      .status { font: 600 13px Inter, "IBM Plex Sans", Arial, sans-serif; fill: #4fd18b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#080a0d"/>
  <text x="64" y="70" class="eyebrow">COORDINATOR OUTCOME</text>
  <text x="64" y="126" class="title">One current directory. History remains inspectable.</text>
  <text x="64" y="164" class="subtitle">Coordinators discover records by stable identity without needing a blockchain outpoint in advance.</text>

  <g transform="translate(64 210)">
    <rect width="924" height="530" rx="8" fill="#0d1014" stroke="#2a3039"/>
    <text x="28" y="44" class="panel-title">Receiver directory</text>
    <rect x="722" y="20" width="174" height="32" rx="4" fill="#14181e" stroke="#2a3039"/>
    <text x="809" y="41" class="small" text-anchor="middle">ILLUSTRATIVE RECORDS</text>
    <line x1="28" y1="72" x2="896" y2="72" stroke="#2a3039"/>

    <text x="28" y="105" class="header">RECEIVER LABEL</text>
    <text x="260" y="105" class="header">INFRASTRUCTURE IDENTITY</text>
    <text x="612" y="105" class="header">STATUS</text>
    <text x="748" y="105" class="header">SEQUENCE</text>

    <rect x="16" y="124" width="892" height="96" rx="6" fill="#14181e" stroke="#5b9cff"/>
    <rect x="16" y="124" width="4" height="96" rx="2" fill="#5b9cff"/>
    <text x="28" y="162" class="body-strong">receiver-east</text>
    <text x="28" y="190" class="small">Selected record</text>
    <text x="260" y="176" class="mono">0x7f2a91c4...9c10</text>
    <circle cx="620" cy="171" r="6" fill="#4fd18b"/>
    <text x="636" y="176" class="status">ACTIVE</text>
    <text x="772" y="176" class="body-strong">2</text>

    <rect x="16" y="232" width="892" height="96" rx="6" fill="#0d1014" stroke="#2a3039"/>
    <text x="28" y="284" class="body-strong">hilltop-04</text>
    <text x="260" y="284" class="mono">0xa833047e...120b</text>
    <circle cx="620" cy="279" r="6" fill="#4fd18b"/>
    <text x="636" y="284" class="status">ACTIVE</text>
    <text x="772" y="284" class="body-strong">0</text>

    <rect x="16" y="340" width="892" height="96" rx="6" fill="#0d1014" stroke="#2a3039"/>
    <text x="28" y="392" class="body-strong">research-node</text>
    <text x="260" y="392" class="mono">0x1dba0c72...f118</text>
    <circle cx="620" cy="387" r="6" fill="#ef6b72"/>
    <text x="636" y="392" class="header" fill="#ef6b72">REVOKED</text>
    <text x="772" y="392" class="body-strong">3</text>

    <line x1="28" y1="466" x2="896" y2="466" stroke="#2a3039"/>
    <text x="28" y="500" class="body">Export current validated records as documented JSON.</text>
    <text x="896" y="500" class="small" text-anchor="end">No physical truth implied</text>
  </g>

  <g transform="translate(1024 210)">
    <rect width="512" height="530" rx="8" fill="#0d1014" stroke="#2a3039"/>
    <text x="28" y="44" class="panel-title">receiver-east history</text>
    <text x="28" y="72" class="mono">0x7f2a91c4...9c10</text>
    <line x1="54" y1="116" x2="54" y2="404" stroke="#2a3039" stroke-width="3"/>

    <circle cx="54" cy="132" r="11" fill="#68d5e8"/>
    <text x="84" y="128" class="body-strong">Created</text>
    <text x="84" y="154" class="body">Sequence 0 · first owner lock</text>

    <circle cx="54" cy="224" r="11" fill="#9b8cf4"/>
    <text x="84" y="220" class="body-strong">Metadata updated</text>
    <text x="84" y="246" class="body">Sequence 1 · identity unchanged</text>

    <circle cx="54" cy="316" r="11" fill="#9b8cf4"/>
    <text x="84" y="312" class="body-strong">Ownership transferred</text>
    <text x="84" y="338" class="body">Sequence 2 · new owner lock</text>

    <circle cx="54" cy="408" r="11" fill="#4fd18b"/>
    <text x="84" y="404" class="body-strong">Current state: active</text>
    <text x="84" y="430" class="body">Discovery returns this successor</text>

    <rect x="28" y="466" width="456" height="40" rx="4" fill="#14181e" stroke="#2a3039"/>
    <text x="48" y="492" class="small">Each accepted change is owner-authorized and ordered.</text>
  </g>

  <text x="64" y="814" class="body-strong">The benefit being tested:</text>
  <text x="266" y="814" class="body">Can owners manage their own records while coordinators retain one inspectable current view?</text>
</svg>
