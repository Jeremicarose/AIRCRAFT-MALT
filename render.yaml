services:
  - type: web
    name: registry-v2-mlat-reference
    runtime: python
    # Reference replay deployment: free and ephemeral by design. Replay data is
    # regenerated after restarts, so no paid persistent disk is required.
    plan: free
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: ./render-entrypoint.sh
    # Keep platform liveness independent from the evidence database. The rich
    # /api/health endpoint remains available to reference and benchmark clients.
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/mlat_demo.db
      # Hosted demo configuration only; not a production template.
      - key: FOURDSKY_TRANSPORT
        value: simulation
      - key: STRICT_PRODUCTION_MODE
        value: "false"
      - key: SIMULATE_IF_UNAVAILABLE
        value: "true"
      - key: ENABLE_ADMIN_API
        value: "false"
      - key: ENABLE_BACKGROUND_BROADCASTER
        # The hosted walkthrough uses bounded REST polling. Avoid a second
        # SQLite polling loop on the memory-constrained free instance.
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SCENARIO
        value: default
      - key: DEMO_READ_ONLY
        value: "true"
      - key: DEMO_LABEL
        value: Hosted demo - Northeast replay
      - key: DEMO_AUTO_CONNECT
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: HEALTH_STALE_SIGNAL_SECONDS
        value: "120"
      - key: STATS_INTERVAL_SECONDS
        value: "60"
